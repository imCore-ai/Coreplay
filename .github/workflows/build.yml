# Builds Coreplay for Windows, Linux and macOS on every push and pull request.
# A tag v<major>.<minor>.<patch> (for example v0.3.0) also publishes a GitHub Release with
# the four downloads: Windows installer, Linux AppImage, Linux .deb, macOS .dmg.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # docker/build-push-action otherwise uploads a build record as an extra artifact.
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        # A tag v1.2.3 gives 1.2.3; any other build gives major.minor (CMakeLists) + the run number.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"
          else v="$(sed -n 's/^project(Coreplay VERSION \([0-9]*\.[0-9]*\).*/\1/p' CMakeLists.txt).$GITHUB_RUN_NUMBER"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Coreplay $v"

  windows:
    needs: version
    runs-on: windows-2022
    env:
      COREPLAY_VERSION: ${{ needs.version.outputs.version }}
      VCPKG_COMMIT: 2fb57e1c4738d4b4484d2234c886caf006612222   # the vcpkg the Windows build is made with
      MPV_URL: https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261111/mpv-dev-x86_64-20261111-git-bcde6b93cc.7z
      MPV_SHA256: 273c079b11ea5575822f972756f4c9a71149a5c10130353abeb8586738938452
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
      HAS_WIN_SIGNING: ${{ secrets.ES_CREDENTIAL_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          cache: true
      - name: vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ env.VCPKG_COMMIT }}-   # a changed vcpkg.json reuses what it can
      - name: vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          git clone https://github.com/microsoft/vcpkg C:\vcpkg-cp
          git -C C:\vcpkg-cp checkout $env:VCPKG_COMMIT
          C:\vcpkg-cp\bootstrap-vcpkg.bat -disableMetrics
      - name: libmpv SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force third_party\mpv | Out-Null
          Invoke-WebRequest $env:MPV_URL -OutFile mpv-dev.7z
          $h = (Get-FileHash mpv-dev.7z -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:MPV_SHA256) { throw "libmpv SDK checksum mismatch: $h" }
          7z x mpv-dev.7z -othird_party\mpv -y | Out-Null
          # The MSVC import library, made from the DLL's exports.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && cd third_party\mpv && dumpbin /exports libmpv-2.dll > exports.txt"
          $names = Get-Content third_party\mpv\exports.txt | ForEach-Object { if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(\S+)') { $matches[1] } }
          @("LIBRARY libmpv-2", "EXPORTS") + $names | Set-Content -Encoding ascii third_party\mpv\mpv.def
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && cd third_party\mpv && lib /def:mpv.def /machine:x64 /out:mpv.lib"
          if (-not (Test-Path third_party\mpv\mpv.lib)) { throw "mpv.lib was not made" }
      - name: NSIS
        shell: pwsh
        run: if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
      - name: Build and package
        shell: pwsh
        run: |
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsis) { $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          .\build.ps1 -QtDir $env:QT_ROOT_DIR -Vcpkg C:\vcpkg-cp -Installer -Nsis $nsis
          "setup=$((Resolve-Path dist\Coreplay-*-Setup.exe).Path)" >> $env:GITHUB_OUTPUT
        id: pkg
      # Install it like a user and start it: it must still run 15 s later (its libraries are
      # delay-loaded, so a missing one crashes it only after the window opens). Error dialogs
      # are off, so a crash ends the process instead of waiting on a dialog.
      - name: Start-up check (installed copy)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "coreplay-installed"
          $p = Start-Process "${{ steps.pkg.outputs.setup }}" -ArgumentList "/S", "/D=$d" -Wait -PassThru
          if ($p.ExitCode) { throw "the installer failed ($($p.ExitCode))" }
          Add-Type -Name EM -Namespace W -MemberDefinition '[DllImport("kernel32.dll")] public static extern uint SetErrorMode(uint m);'
          [W.EM]::SetErrorMode(3) | Out-Null
          $app = Start-Process "$d\coreplay.exe" -PassThru
          Start-Sleep 15
          # This machine has no GPU: Coreplay restarts itself once on software OpenGL (a new
          # process). A crash leaves no Coreplay running.
          $running = @(Get-Process coreplay -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$d\*" })
          if ($app.HasExited) { "first process ended: 0x{0:X8} (0 = the software OpenGL restart)" -f $app.ExitCode }
          if ($app.HasExited -and $app.ExitCode -ne 0) { throw ("Coreplay crashed at start (exit 0x{0:X8})" -f $app.ExitCode) }
          if (-not $running) { throw "no Coreplay is running 15 s after the start" }
          $running | Stop-Process -Force
          "Coreplay ran for 15 s"
      # Code signing (SSL.com OV certificate, eSigner cloud key). Runs only when the four
      # ES_* secrets are set; until then the installer stays unsigned.
      - name: Sign the installer (SSL.com eSigner)
        if: env.HAS_WIN_SIGNING == 'true'
        uses: SSLcom/esigner-codesign@v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${{ steps.pkg.outputs.setup }}
          override: true
          malware_block: false
          environment_name: PROD
      - name: Check the signature
        if: env.HAS_WIN_SIGNING == 'true'
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature "${{ steps.pkg.outputs.setup }}"
          "$($s.Status)  $($s.SignerCertificate.Subject)"
          if ($s.Status -ne 'Valid') { throw "installer signature is $($s.Status)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Coreplay-*-Setup.exe
          if-no-files-found: error

  linux-appimage:
    needs: version
    runs-on: ubuntu-24.04
    env:
      COREPLAY_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build container (cached)
        uses: docker/build-push-action@v6
        with:
          context: tools/linux
          file: tools/linux/appimage.Dockerfile
          tags: coreplay-appimage-build
          load: true
          cache-from: type=gha,scope=appimage
          cache-to: type=gha,mode=max,scope=appimage
      - name: Build AppImage
        run: |
          mkdir -p out
          docker run --rm -e COREPLAY_VERSION -v "$PWD:/src:ro" -v "$PWD/out:/out" coreplay-appimage-build bash /src/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: out/Coreplay-*-x86_64.AppImage
          if-no-files-found: error

  # The .deb carries the AppImage's files (its own Qt, libmpv, OpenImageIO, OpenColorIO),
  # so one .deb installs on Ubuntu 22.04+ and Debian 12+. A .deb on a distribution's own
  # libraries installed only on Ubuntu 26.04.
  linux-deb:
    needs: [version, linux-appimage]
    runs-on: ubuntu-24.04
    env:
      COREPLAY_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: appimage
      - name: Build .deb
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/appimage:/ai:ro" -v "$PWD/out:/out" ubuntu:22.04 \
            bash /src/tools/linux/make_deb.sh /ai/Coreplay-$COREPLAY_VERSION-x86_64.AppImage "$COREPLAY_VERSION" /out
      # apt must find every Depends, every library must resolve, and Coreplay must start.
      - name: Install check (Ubuntu 22.04, Ubuntu 24.04, Debian 12)
        run: |
          for img in ubuntu:22.04 ubuntu:24.04 debian:12; do
            docker run --rm -v "$PWD/out:/deb:ro" "$img" bash -c '
              set -e; export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq >/dev/null
              apt-get install -y -qq /deb/coreplay_*_amd64.deb >/dev/null
              missing=$(find /opt/coreplay/usr/bin /opt/coreplay/usr/lib -maxdepth 1 -type f -exec sh -c "LD_LIBRARY_PATH=/opt/coreplay/usr/lib ldd \"\$1\" | grep \"not found\"" _ {} \; || true)
              if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
              apt-get install -y -qq --no-install-recommends xvfb xauth libgl1-mesa-dri >/dev/null
              Xvfb :99 >/dev/null 2>&1 & sleep 2
              DISPLAY=:99 QT_QPA_PLATFORM=xcb coreplay & pid=$!
              sleep 10
              kill -0 $pid
              echo "'"$img"': installed, every library found, Coreplay is running after 10 s"'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: out/coreplay_*_amd64.deb
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-15   # Apple silicon (arm64)
    env:
      COREPLAY_VERSION: ${{ needs.version.outputs.version }}
      HAS_MAC_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: brew install qt mpv openimageio opencolorio ninja pkg-config
      - name: Icon
        run: |
          mkdir -p coreplay.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s res/coreplay.png --out coreplay.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) res/coreplay.png --out coreplay.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns coreplay.iconset -o res/coreplay.icns
      - name: Build
        run: |
          # mpv.pc requires libarchive, which Homebrew keeps out of the default paths (keg-only).
          export PKG_CONFIG_PATH="$(brew --prefix libarchive)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          pkg-config --libs mpv
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" -DCOREPLAY_VERSION_FULL="$COREPLAY_VERSION"
          ninja -C build
      - name: Package (.app with its libraries, signed, .dmg)
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          "$(brew --prefix qt)/bin/macdeployqt" build/Coreplay.app -always-overwrite
          # Plugins for Qt parts Coreplay does not use (PDF, SVG, virtual keyboard): their
          # frameworks are not installed, so they could only fail to load. Remove them.
          rm -f build/Coreplay.app/Contents/PlugIns/imageformats/libqpdf.dylib \
                build/Coreplay.app/Contents/PlugIns/imageformats/libqsvg.dylib \
                build/Coreplay.app/Contents/PlugIns/iconengines/libqsvgicon.dylib \
                build/Coreplay.app/Contents/PlugIns/platforminputcontexts/libqtvirtualkeyboardplugin.dylib
          # Every library finds the others inside the app, nothing points outside it (fails
          # the build otherwise). Before signing: install_name_tool changes the files.
          bash tools/macos/fix_bundle.sh build/Coreplay.app
          if [ "$HAS_MAC_SIGNING" = "true" ]; then
            # Developer ID signing (hardened runtime, secure timestamp), in a throw-away keychain.
            kc="$RUNNER_TEMP/signing.keychain-db"; kcpw="$(uuidgen)"
            echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$kcpw" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$kcpw" "$kc"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            rm -f "$RUNNER_TEMP/cert.p12"
            identity="$(security find-identity -v -p codesigning "$kc" | grep -m1 'Developer ID Application' | sed -E 's/.*"(.*)"/\1/')"
            test -n "$identity" || { echo "no Developer ID Application identity in the certificate"; exit 1; }
            echo "Signing as: $identity"
            # libmpv runs Lua scripts (LuaJIT), which needs JIT memory under the hardened runtime.
            cat > "$RUNNER_TEMP/entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
          </dict></plist>
          PLIST
            sign() { codesign --force --timestamp --options runtime --sign "$identity" "$@"; }
            # Inside out: every library and plugin first, then the frameworks, then the app.
            find build/Coreplay.app/Contents -type f \( -name '*.dylib' -o -name '*.so' \) -print0 | xargs -0 -n 20 codesign --force --timestamp --options runtime --sign "$identity"
            for f in build/Coreplay.app/Contents/Frameworks/*.framework; do [ -e "$f" ] && sign "$f"; done
            sign --entitlements "$RUNNER_TEMP/entitlements.plist" build/Coreplay.app
            codesign --verify --deep --strict --verbose=2 build/Coreplay.app
          else
            codesign --force --deep --sign - build/Coreplay.app   # ad-hoc: runs, but not trusted
            codesign --verify --deep build/Coreplay.app
          fi
          mkdir -p out dmg && cp -R build/Coreplay.app dmg/ && ln -s /Applications dmg/Applications
          dmg="out/Coreplay-$COREPLAY_VERSION-macOS-arm64.dmg"
          hdiutil create -volname Coreplay -srcfolder dmg -ov -format UDZO "$dmg"
          [ "$HAS_MAC_SIGNING" = "true" ] && codesign --force --timestamp --sign "$identity" "$dmg" || true
      # Notarization (Apple checks the signed .dmg) and stapling (the ticket travels with
      # the file, so it opens offline without the right-click step). Needs the API key secrets.
      - name: Notarize and staple
        if: env.HAS_MAC_SIGNING == 'true'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/key.p8"
          dmg="$(ls out/Coreplay-*-macOS-arm64.dmg)"
          xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/key.p8" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 30m
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          rm -f "$RUNNER_TEMP/key.p8"
      # Like a user's Mac: Homebrew is hidden, so the app can only use what is inside it.
      # Starts the app from the .dmg (as a user does), not from the build folder.
      - name: Start-up check (without Homebrew)
        run: |
          sudo mv /opt/homebrew /opt/homebrew-hidden
          trap 'sudo mv /opt/homebrew-hidden /opt/homebrew' EXIT
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" out/Coreplay-*-macOS-arm64.dmg >/dev/null
          "$mnt/Coreplay.app/Contents/MacOS/Coreplay" > "$RUNNER_TEMP/start.log" 2>&1 & pid=$!
          sleep 10
          if kill -0 $pid; then
            echo "Coreplay (from the .dmg, no Homebrew) is running after 10 s"; kill $pid; sleep 1
          else
            echo "Coreplay exited:"; cat "$RUNNER_TEMP/start.log"; hdiutil detach "$mnt" >/dev/null || true; exit 1
          fi
          hdiutil detach "$mnt" >/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/Coreplay-*-macOS-arm64.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, linux-appimage, linux-deb, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Only the four downloads, by name (not any other artifact of the run).
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: files
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: files
      - uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: files
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: files
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Copies with fixed names, so the README's ".../releases/latest/download/<name>"
          # links always give the newest version.
          cp files/Coreplay-*-Setup.exe            files/Coreplay-Windows-Setup.exe
          cp files/Coreplay-*-x86_64.AppImage      files/Coreplay-Linux-x86_64.AppImage
          cp files/coreplay_*_amd64.deb            files/Coreplay-Linux-amd64.deb
          cp files/Coreplay-*-macOS-arm64.dmg      files/Coreplay-macOS-arm64.dmg
          ls -la files
          # The release text is the tag's message (tools/sync_github.py writes it from
          # .github/release_notes.md). A tag without it stops here: no bare release.
          obj=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type + " " + .object.sha')
          [ "${obj%% *}" = tag ] || { echo "::error::$GITHUB_REF_NAME is not an annotated tag"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/git/tags/${obj#* }" --jq .message > notes.md
          grep -q '^## Download' notes.md || { echo "::error::the tag message has no release notes"; cat notes.md; exit 1; }
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" \
            --title "Coreplay ${{ needs.version.outputs.version }}" --notes-file notes.md
